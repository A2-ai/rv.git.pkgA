name: R Release Testing

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the release"
        required: true
        type: string

jobs:
  build-src:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tarball_name: ${{ steps.releaser.outputs.tarball_name }}
      linking_to_deps: ${{ steps.releaser.outputs.linking_to_deps }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Install the latest version of rv
        uses: a2-ai/setup-rv@main

      - name: sync
        run: rv sync

      - name: get library path
        id: library
        run: |
          OUTPUT=$(rv library)
          echo "result=$OUTPUT" >> $GITHUB_OUTPUT
          echo "Library path: $OUTPUT"

      - name: Run R Releaser build-src
        id: releaser
        uses: A2-ai/r-releaser/build-src@deploy-prism
        with:
          library: ${{ steps.library.outputs.result }}
          resave-data: false
          md5: true
          user: github-action-builder
          metadata: |
            {
              "githubref": "${{ github.ref_name }}",
              "githubtag": "${{ github.event.inputs.tag }}"
            }

      - name: Upload src tarball to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.releaser.outputs.tarball_path }}
          asset_name: ${{ steps.releaser.outputs.tarball_name }}
          tag: ${{ github.event.inputs.tag }}
          overwrite: true

      - name: Upload src tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: ${{ steps.releaser.outputs.tarball_path }}
          if-no-files-found: error

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-source
          path: manifest.json
          if-no-files-found: error

  build-bin:
    name: build-bin (${{ matrix.platform }}, R ${{ matrix.r_version }})
    needs: build-src
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: '["ubuntu-22.04"]'
            r_version: "4.4"
            platform: "ubuntu-22.04-x86_64"
          - runner: '["ubuntu-22.04"]'
            r_version: "4.5"
            platform: "ubuntu-22.04-x86_64"
          - runner: '["ubuntu-24.04"]'
            r_version: "4.4"
            platform: "ubuntu-24.04-x86_64"
          - runner: '["ubuntu-24.04"]'
            r_version: "4.5"
            platform: "ubuntu-24.04-x86_64"
          # - runner: '["self-hosted", "macOS", "ARM64"]'
          #   r_version: "4.4"
          #   platform: "macos-arm64-selfhosted"
          # - runner: '["self-hosted", "macOS", "ARM64"]'
          #   r_version: "4.5"
          #   platform: "macos-arm64-selfhosted"
    runs-on: ${{ fromJson(matrix.runner) }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R (${{ matrix.r_version }})
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r_version }}

      - name: Install the latest version of rv
        uses: a2-ai/setup-rv@main

      - name: replace-rversion
        run: |
          perl -i -pe 's|^r_version = "4\.[0-9\.]+"$|r_version = "${{ matrix.r_version }}"|' rproject.toml
          cat rproject.toml
        if: runner.os != 'Windows'

      - name: sync
        run: rv sync

      - name: get library path
        id: library
        run: |
          OUTPUT=$(rv library)
          echo "result=$OUTPUT" >> $GITHUB_OUTPUT
          echo "Library path: $OUTPUT"

      - name: Download source tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: source-tarball
          path: dist-src

      - name: Verify source tarball path
        id: src-tarball
        run: |
          SRC_PATH="$GITHUB_WORKSPACE/dist-src/${{ needs.build-src.outputs.tarball_name }}"
          test -f "$SRC_PATH"
          echo "path=$SRC_PATH" >> $GITHUB_OUTPUT

      - name: Run R Releaser build-bin (${{ matrix.platform }}, R ${{ matrix.r_version }})
        id: releaser-bin
        uses: A2-ai/r-releaser/build-bin@deploy-prism
        with:
          library: ${{ steps.library.outputs.result }}
          src_tarball_path: ${{ steps.src-tarball.outputs.path }}
          linking_to_deps: ${{ needs.build-src.outputs.linking_to_deps }}

      - name: Upload binary to release (${{ matrix.platform }}, R ${{ matrix.r_version }})
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.releaser-bin.outputs.binary_path }}
          asset_name: ${{ steps.releaser-bin.outputs.binary_name }}
          tag: ${{ github.event.inputs.tag }}
          overwrite: true

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.platform }}-r${{ matrix.r_version }}
          path: manifest.json
          if-no-files-found: error

  finalize:
    needs: [build-src, build-bin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Merge manifests
        id: merge
        uses: A2-ai/r-releaser/merge-manifests@deploy-prism

      - name: Upload manifest to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.merge.outputs.manifest_path }}
          asset_name: manifest.json
          tag: ${{ github.event.inputs.tag }}
          overwrite: true

